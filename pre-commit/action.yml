name: Pre-Commit Result to PR comment
description: "run pre-commit hooks after pushing something to repository and publish diff result into PR comment"
author: Das Meta
branding:
  icon: globe
  color: purple
inputs:
  repo-token:
    description: "GitHub token for commenting on PRs. Defaults to using 'secrets.GITHUB_TOKEN'"
    required: false
  path:
    description: "Directory relative to the repository root where pre-commit runs (avoid `/`; use `.` for repo root)."
    required: false
    default: "."
runs:
  using: composite
  steps:
  - name: Check out code
    uses: actions/checkout@v3
    with:
      fetch-depth: 0
      
  - run: python -m pip install pre-commit
    shell: bash
  - run: python -m pip freeze --local
    shell: bash
  - run: |
        curl -sSLo ./terraform-docs.tar.gz https://terraform-docs.io/dl/v0.16.0/terraform-docs-v0.16.0-$(uname)-amd64.tar.gz
        tar -xzf terraform-docs.tar.gz
        chmod +x terraform-docs
        sudo mv terraform-docs /usr/bin/terraform-docs
    shell: bash
  - name: Setup Terraform
    uses: hashicorp/setup-terraform@v2
    with:
      terraform_version: 1.2.1
  - uses: actions/cache@v3
    with:
      path: ~/.cache/pre-commit
      key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
  - run: |
      set -euo pipefail
      TARGET="${{ inputs.path }}"
      if [ -z "$TARGET" ] || [ "$TARGET" = "/" ]; then
        TARGET="."
      fi
      cd "$TARGET"
      touch results.txt
      set +e
      pre-commit run -a 2>&1 | sed -E 's/^([[:space:]]+)([-+])/\2\1/g' > results.txt
    shell: bash
    continue-on-error: true
    
  - name: Put Files in ENV Vars
    run: |
      TARGET="${{ inputs.path }}"
      if [ -z "$TARGET" ] || [ "$TARGET" = "/" ]; then
        TARGET="."
      fi
      cd "$TARGET"
      RESULT="$(cat results.txt 2>/dev/null || true)"
      echo "RESULT<<EOF" >> "$GITHUB_ENV"
      echo "$RESULT" >> "$GITHUB_ENV"
      echo "EOF" >> "$GITHUB_ENV"
    shell: bash

  - name: check if pre-commit run has errors
    run: |
      if echo "${RESULT}" | grep -q "Failed"; then
        exit 1
      fi
    shell: bash
    env:
      RESULT: ${{ env.RESULT }}

  - name: Post to GitHub PR
    if: ${{ !cancelled() && (success() || failure()) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') }}
    uses: mshick/add-pr-comment@v1
    with:
      repo-token: ${{ inputs.repo-token }}
      allow-repeats: true
      repo-token-user-login: 'github-actions[bot]'
      message: |
          ## Output
          ```diff
          ${{ env.RESULT }}
          ```
